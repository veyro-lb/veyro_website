name: Recover deployed Veyro site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Recover the deployed website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets

          curl -fL --retry 3 "https://veyro.jamesloom18.workers.dev/" -o public/index.html
          curl -fL --retry 3 "https://veyro.jamesloom18.workers.dev/assets/styles.css" -o public/assets/styles.css
          curl -fL --retry 3 "https://veyro.jamesloom18.workers.dev/assets/main.js" -o public/assets/main.js
          curl -fL --retry 3 "https://veyro.jamesloom18.workers.dev/assets/favicon.svg" -o public/assets/favicon.svg
          curl -fL --retry 3 "https://veyro.jamesloom18.workers.dev/assets/veyro-og.png" -o public/assets/veyro-og.png

          cat > wrangler.jsonc <<'EOF'
          {
            "name": "veyro",
            "compatibility_date": "2026-08-19",
            "assets": {
              "directory": "./public/"
            }
          }
          EOF

          cat > .gitignore <<'EOF'
          .wrangler/
          .DS_Store
          EOF

          # This workflow is only needed once for recovery.
          rm -f .github/workflows/recover-veyro.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No recovered-file changes to commit."
            exit 0
          fi

          git commit -m "Recover Veyro site from Cloudflare deployment"
          git push
